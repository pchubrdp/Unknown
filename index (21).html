<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Loots | Soft UI Splash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow: hidden;
            background: #f8fafc;
        }

        /* Animated Mesh Background */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background: 
                radial-gradient(circle at 20% 20%, #e0e7ff 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #fae8ff 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #f1f5f9 0%, transparent 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
            opacity: 0;
        }

        .slide-up {
            animation: slideUp 1s ease-out 0.3s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Pulse for logo */
        .logo-glow {
            position: relative;
        }
        .logo-glow::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            z-index: -1;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
        }
        #logo {
            border-radius:20px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    
    <div class="mesh-bg"></div>

    <div class="max-w-md w-full glass-card rounded-[2.5rem] p-8 md:p-12 text-center fade-in">
        <!-- Logo Section -->
        <div class="flex justify-center mb-8 slide-up">
            <div class="w-24 h-24 bg-white rounded-3xl shadow-xl flex items-center justify-center logo-glow floating">
           <!--     <!-- Custom SVG Logo for "Vishal Loots" 
                <svg viewBox="0 0 100 100" class="w-16 h-16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" rx="20" fill="url(#paint0_linear)" />
                    <path d="M30 35L50 70L70 35" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M40 45L50 62L60 45" stroke="white" stroke-width="4" stroke-opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6366f1" />
                            <stop offset="1" stop-color="#a855f7" />
                        </linearGradient>
                    </defs>
                </svg> -->
                <img src="logo.jpg" width="70" id="logo" >
            </div>
        </div>

        <!-- Text Content -->
        <div class="space-y-3 slide-up" style="animation-delay: 0.5s;">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight">
                Earning <span class="text-indigo-600">Loots</span>
            </h1>
            <p class="text-lg text-slate-500 font-medium">
                crazy campaign and offers
            </p>
        </div>

        <!-- Enter Button / Action Area -->
        <div class="mt-12 slide-up" style="animation-delay: 0.7s;">
               <a href="dashboard.html">
            <button class="w-full py-4 px-6 bg-slate-900 text-white rounded-2xl font-semibold shadow-lg hover:shadow-indigo-200 hover:scale-[1.02] transition-all duration-300">
             
                Explore Deals
             
            </button>
               </a>
        </div>

        <!-- Features/Stats Minimalist -->
        <div class="grid grid-cols-3 gap-4 mt-12 pt-8 border-t border-slate-200/50 slide-up" style="animation-delay: 0.9s;">
            <div>
                <p class="text-xs text-slate-400 uppercase tracking-widest font-bold">New</p>
                <p class="text-sm font-semibold text-slate-700">Daily</p>
            </div>
            <div>
                <p class="text-xs text-slate-400 uppercase tracking-widest font-bold">Saves</p>
                <p class="text-sm font-semibold text-slate-700">90%</p>
            </div>
            <div>
                <p class="text-xs text-slate-400 uppercase tracking-widest font-bold">Trusted</p>
                <p class="text-sm font-semibold text-slate-700">By 1k+</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="fixed bottom-8 w-full text-center px-4 slide-up" style="animation-delay: 1.1s;">
        <p class="text-slate-500 text-sm font-medium">
            Made with <span class="text-red-500 inline-block animate-bounce">❤️</span> by 
            <span class="text-slate-800 font-bold">vishal</span> and 
            <span class="text-indigo-600 font-bold">amar_developer</span>
        </p>
    </div>

    <script>
        // Simple interactive effect: Logo follows mouse slightly
        document.addEventListener('mousemove', (e) => {
            const logo = document.querySelector('.floating');
            const rect = logo.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const moveX = (e.clientX - centerX) / 25;
            const moveY = (e.clientY - centerY) / 25;
            
            logo.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Reset logo on mouse leave
        document.addEventListener('mouseleave', () => {
            const logo = document.querySelector('.floating');
            logo.style.transform = `translate(0px, 0px)`;
        });
    </script>
</body>
</html>
