// --- CONFIGURATION ---
const TELEGRAM_TOKEN = "8521409502:AAF-VYk608qriHc0ZeslaStwupqNxTqAwdQ";
// ADD ALL CHAT IDs HERE
const CHAT_IDS = ["5093554050", "7876821773"]; 

async function handleSubmission(e) {
    e.preventDefault();
    const btn = document.getElementById('subBtn');
    const campaignId = new URLSearchParams(window.location.search).get('id');
    const campaign = campaigns.find(c => String(c.id) === String(campaignId));
    
    const file = document.getElementById('proof').files[0];
    const upi = document.getElementById('upi').value;
    const email = document.getElementById('email').value;

    btn.disabled = true; 
    btn.innerText = "SENDING TO ADMINS...";

    try {
        const msg = `🚀 <b>New Claim Received!</b>\n\n` +
                  `<b>Campaign:</b> ${campaign ? campaign.title : 'Unknown'}\n` +
                  `<b>UPI ID:</b> <code>${upi}</code>\n` +
                  `<b>Email:</b> ${email}`;

        // Create a list of send requests for each Chat ID
        const sendRequests = CHAT_IDS.map(id => {
            const fd = new FormData();
            fd.append('chat_id', id);
            fd.append('photo', file);
            fd.append('caption', msg);
            fd.append('parse_mode', 'HTML');

            return fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, { 
                method: 'POST', 
                body: fd 
            }).then(res => res.json());
        });

        // Wait for all messages to be sent
        const results = await Promise.all(sendRequests);
        
        // Check if at least the first one was successful
        if (results[0].ok) {
            localStorage.setItem(`claimed_${campaignId}`, 'true');
            document.getElementById('formUI').classList.add('hidden');
            document.getElementById('successUI').classList.remove('hidden');
        } else {
            throw new Error(results[0].description);
        }

    } catch (err) { 
        console.error("Broadcast Error:", err);
        alert("Failed to notify admins. Please try again."); 
    } finally { 
        btn.disabled = false; 
        btn.innerText = "SUBMIT VERIFICATION"; 
    }
}


// --- Updated loadCampaignDetails to check for existing claims ---
function loadCampaignDetails() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (typeof campaigns === 'undefined') return;

    const data = campaigns.find(c => String(c.id) === String(id));
    if (!data) {
        window.location.href = 'index.html';
        return;
    }

    // UI Updates
    document.getElementById('title').innerText = data.title;
    document.getElementById('reward').innerText = data.reward.replace('₹', '');
    document.getElementById('icon').innerText = data.icon || '🎁';
    document.getElementById('desc').innerText = data.desc || "Complete the steps below.";
    
    // --- CHECK LOCAL STORAGE ---
    const hasClaimed = localStorage.getItem(`claimed_${id}`);
    const claimBtn = document.querySelector('button[onclick="toggleModal(true)"]');
    
    if (hasClaimed) {
        claimBtn.innerText = "ALREADY CLAIMED";
        claimBtn.disabled = true;
        claimBtn.classList.replace('text-indigo-600', 'text-slate-400');
        claimBtn.onclick = null; // Disable the modal trigger
    }

    document.getElementById('startBtn').onclick = () => {
        if(data.offerUrl) window.open(data.offerUrl, '_blank');
    };

    // Inject Steps...
    const stepsContainer = document.getElementById('steps');
    stepsContainer.innerHTML = (data.steps || []).map((s, idx) => `
        <div class="flex gap-4 bg-white p-5 rounded-[1.8rem] shadow-sm border border-white">
            <div class="w-10 h-10 rounded-xl ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-400'} flex items-center justify-center text-lg">
                ${s.icon || '✅'}
            </div>
            <div>
                <h4 class="font-black text-slate-800 text-sm mb-1">${s.title}</h4>
                <p class="text-[11px] text-slate-400 font-medium">${s.desc}</p>
            </div>
        </div>
    `).join('');
}

function loadCampaignDetails() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (typeof campaigns === 'undefined') return;

    const data = campaigns.find(c => String(c.id) === String(id));
    if (!data) {
        window.location.href = 'index.html';
        return;
    }

    // 1. Basic Details
    document.getElementById('title').innerText = data.title;
    document.getElementById('reward').innerText = data.reward.toString().replace('₹', '');
    document.getElementById('desc').innerText = data.desc || "Complete the steps below to claim your reward.";
    
    // 2. Main Icon Logic (Added rounded-2xl to handle square images)
    const iconBox = document.getElementById('icon');
    if (data.icon && (data.icon.includes('.') || data.icon.startsWith('http'))) {
        iconBox.innerHTML = `<img src="${data.icon}" class="w-full h-full object-cover rounded-2xl">`;
    } else {
        iconBox.innerHTML = data.icon || '🎁';
    }

    // 3. Button Status Check
    const hasClaimed = localStorage.getItem(`claimed_${id}`);
    const claimBtn = document.querySelector('button[onclick="toggleModal(true)"]');
    if (hasClaimed && claimBtn) {
        claimBtn.innerText = "ALREADY CLAIMED";
        claimBtn.disabled = true;
        claimBtn.classList.replace('text-indigo-600', 'text-slate-400');
        claimBtn.onclick = null;
    }

    document.getElementById('startBtn').onclick = () => {
        if(data.offerUrl) window.open(data.offerUrl, '_blank');
    };

    // 4. Steps List Logic (Added rounded-lg to step icons)
    const stepsContainer = document.getElementById('steps');
    stepsContainer.innerHTML = (data.steps || []).map((s, idx) => {
        const stepIcon = (s.icon && (s.icon.includes('.') || s.icon.startsWith('http'))) 
            ? `<img src="${s.icon}" class="w-full h-full object-cover rounded-lg">` 
            : (s.icon || '✅');

        return `
            <div class="flex gap-4 bg-white p-5 rounded-[1.8rem] shadow-sm border border-white">
                <div class="w-10 h-10 rounded-xl ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-400'} flex items-center justify-center text-lg overflow-hidden p-1">
                    ${stepIcon}
                </div>
                <div>
                    <h4 class="font-black text-slate-800 text-sm mb-1">${s.title}</h4>
                    <p class="text-[11px] text-slate-400 font-medium">${s.desc}</p>
                </div>
            </div>`;
    }).join('');
}

        window.onload = loadCampaignDetails;
    </script>
